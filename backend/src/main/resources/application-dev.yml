# 本地开发环境（凭据从环境变量读取；生产 profile 禁用默认凭据，见架构设计.md §7）
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/community_residence?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 30000
      validation-query: SELECT 1
      test-while-idle: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      # 密码留空时不能写 password: ""（Redisson 会向无密码 Redis 发 AUTH 被拒）；
      # 本地 Memurai/Redis 无密码，有密码的环境通过 REDIS_PASSWORD 非空注入再启用
      # password: ${REDIS_PASSWORD}
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1

logging:
  level:
    com.community.residence: debug

# 支付渠道凭据（dev）：默认双渠道禁用（payment.* 模板见 application.yml；
# 支付宝沙箱可开通——配置 PAYMENT_ALIPAY_* 四项环境变量后自动启用；
# 微信需商户号+API 证书（PAYMENT_WECHAT_* 五项），本地通常禁用）。
# 渠道状态可启动后经 GET /api/v1/payment/channels 验证。
