spring:
  application:
    name: community-residence-service
  profiles:
    active: dev
  # 本地凭据文件：把仓库根目录的 .env 当 properties 读入 Environment，
  # 使 `./mvnw spring-boot:run` 无需手工 export（模板见仓库根 .env.example）。
  # optional: 文件不存在不报错；同时导入 ../.env 以覆盖在 backend/ 下启动的情形。
  # 优先级：命令行参数 > 系统环境变量 > .env > 本文件默认值。
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  flyway:
    enabled: true
    locations: classpath:db/migration
  # 文件上传限制（接口设计.md §5.1：图片 ≤5MB、文档 ≤10MB）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

server:
  port: 8080

# JWT 签发配置（密钥经环境变量注入；dev 默认值仅限本机开发，生产 profile 拒绝默认密钥）
auth:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-0123456789abcdef-0123456789abcdef}
    access-ttl: 36h

# 文件上传本地存储目录（生产可替换为对象存储；FileUploadService 为唯一写入点）
upload:
  dir: ./uploads

# 支付渠道凭据配置（R61 租约续约支付；默认空 = 该渠道禁用，
# GET /api/v1/payment/channels 返回 enabled=false，不报错不阻断。
# 支付宝由超管程序内配置，私钥加密入库，本批保持交易停用；微信仍凭据门控。
# 支付宝沙箱可开通：网关 https://openapi-sandbox.dl.alipaydev.com + 测试买家账号；
# 微信无公开沙箱：需商户号 + API 证书（apiclient_key.pem）。
# 本地无公网回调，支付结果以主动查单为准（决策日志 2026-09-20 R61））
payment:
  # 公网部署时的异步通知地址（本地留空 = 查单替代回调；接入点见 PaymentController 预留注释）
  # notify-url: https://your-domain.example.com/api/v1/payment/notify
  channel-config:
    # 仅为存储加密密钥的服务器文件路径，不是支付凭据；默认在仓库之外。
    key-file: ${PAYMENT_CONFIG_KEY_FILE:${user.home}/.community-residence/payment/master.key}
  wechat:
    # 商户号 mchid
    mchid: ${PAYMENT_WECHAT_MCH_ID:}
    # 应用 appid
    appid: ${PAYMENT_WECHAT_APP_ID:}
    # APIv3 密钥
    api-v3-key: ${PAYMENT_WECHAT_API_V3_KEY:}
    # 商户 API 证书序列号
    merchant-serial-number: ${PAYMENT_WECHAT_MERCHANT_SERIAL_NO:}
    # 商户 API 私钥（apiclient_key.pem 内容，与 private-key-path 二选一）
    private-key: ${PAYMENT_WECHAT_PRIVATE_KEY:}
    # 商户 API 私钥文件路径
    private-key-path: ${PAYMENT_WECHAT_PRIVATE_KEY_PATH:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
