const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const icon=name=>`<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search);let role=['admin','resident','staff'].includes(params.get('role'))?params.get('role'):'admin',state=params.get('state')||'normal',category='all',filter='all',selected=null,drafts={},menu=false,more=false,drawer=null;
if(params.get('capture')==='1')document.body.classList.add('capture');

function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,2800)}

function setRole(next){if(getCurrent()&&$('#composer-input'))drafts[`${role}/${selected}`]=$('#composer-input').value;role=next;category='all';filter='all';selected=null;menu=more=false;drawer=null;$('#search').value='';data=fixtures.filter(d=>role!=='staff'||['work','view'].includes(d.type)).map(d=>({...d}));if(role==='resident')data.find(d=>d.type==='direct').title='阳光花园管理处';if(state==='feedback'&&role==='staff')state='normal';selected=state==='feedback'?'feedback:3':state==='closed'?'work:6':role==='staff'?'work:2':'lease:1';data.find(d=>d.key===selected).unread=0;renderFrame();renderList();renderChat()}
function renderFrame(){document.body.classList.toggle('not-admin',role!=='admin');$$('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role));$('#state-select').value=state;$('#role-label').textContent=roleUsers[role][2];$('#user-name').textContent=roleUsers[role][0];$('#user-avatar').textContent=roleUsers[role][1];$('#top-nav').innerHTML=role==='admin'?'<span>社区服务管理 / 消息会话</span>':(role==='staff'?['工作台','我的工单','我的带看','消息']:['首页','公共资源','我的预约','租住与房源','我的工单','我的反馈','公告','消息']).map((n,i)=>`<span class="${n==='消息'?'active':i<3?'secondary':i<6?'low-priority':''}">${n}</span>`).join('');$('#outer-nav').innerHTML=[['grid','运营看板'],['home','社区管理'],['work','工单调度'],['view','人员排班'],['direct','服务人员'],['direct','居民管理'],['home','租住与房源'],['bell','公告'],['feedback','反馈'],['view','预约'],['check','评价'],['bell','消息中心'],['chat','消息会话'],['gear','系统']].map(([i,n])=>`<div class="nav-row ${n==='消息会话'?'active':''}">${icon(i)}<span>${n}</span></div>`).join('');$('#page-subtitle').textContent=role==='staff'?'本人参与的工单与带看沟通':'租约、看房、工单、反馈与社区直通';$('#create-conversation').hidden=role==='staff';$('#create-label').textContent=role==='resident'?'联系社区管理员':'发起直通会话';renderRail()}
function renderRail(){$('#business-rail').innerHTML=categories.filter(([key])=>role!=='staff'||['all','work','view'].includes(key)).map(([key,label,i])=>`<button data-category="${key}" class="${category===key?'active':''}" aria-label="${label}会话" aria-pressed="${category===key}">${icon(i)}<span>${label}</span>${!['empty','error'].includes(state)&&data.some(d=>d.unread>0&&(key==='all'||d.type===key))?'<i class="tiny-dot"></i>':''}</button>`).join('')+`<div class="rail-bottom" title="仅展示有权访问的业务">${icon('lock')}</div>`;$$('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;renderRail();renderList();$('.workspace').classList.add('show-list')})}
function renderList(){const q=$('#search').value.trim().toLowerCase();let rows=state==='empty'||state==='error'?[]:data.filter(d=>(category==='all'||d.type===category)&&(filter==='all'||d.unread>0||d.key===selected)&&(d.title+d.label+d.person).toLowerCase().includes(q)).sort((a,b)=>b.stamp-a.stamp);$('#list-category').textContent=category==='all'?'全部会话':categories.find(c=>c[0]===category)[1]+'会话';$('#list-total').textContent=`${rows.length} 个`;$('#conversation-list').innerHTML=rows.length?rows.map(d=>`<button class="conversation-item ${selected===d.key?'active':''}" data-key="${d.key}" aria-label="${esc(d.title)}"><span class="type-avatar ${d.type}">${icon(categories.find(c=>c[0]===d.type)[2])}</span><span class="item-content"><span class="item-first"><span class="item-title">${esc(d.title)}</span><span class="item-time">${d.time}</span></span><span class="item-summary"><span class="excerpt">${esc(d.summary)}</span>${d.unread?`<span class="unread" aria-label="${d.unread}条未读">${d.unread>99?'99+':d.unread}</span>`:''}</span><span class="item-type">${esc(d.label)}</span></span></button>`).join(''):`<div class="list-empty">${state==='error'?'会话列表加载失败':state==='empty'?'暂无参与的会话':'没有找到匹配的会话'}<br><small>${state==='error'?'请重试，不影响已保存消息':state==='empty'?'从对应业务进入沟通后显示在这里':'试试会话名称或业务编号'}</small></div>`;$$('[data-key]').forEach(b=>b.onclick=()=>selectConversation(b.dataset.key));$$('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter))}

function msg(name,initial,content,mine=false,tag=''){return `<div class="message ${mine?'mine':''}"><span class="avatar">${initial}</span><div class="message-content"><div class="message-label"><span>${name}</span>${tag?`<span class="role-tag">${tag}</span>`:''}</div><div class="bubble">${content}</div></div></div>`}

function chatMessages(d){let out='<div class="date-divider">今天 · 10月17日</div>';if(d.type==='lease'){out+='<div class="system-message">居民与社区管理方在此沟通租约事项</div>';out+=msg('林悦','林','您好，协议里的首期付款安排我想再确认一下。',role==='resident','居民');out+=msg('陈晓','陈','合同总期限是12个月，首期为1个月租金和押金。后续租金按约定缴纳，不需要一次付完全年。',role==='admin','社区管理员');out+=agreement();out+=msg('林悦','林','明白了，我会查看协议后确认。',role==='resident','居民')}else if(d.type==='work'){out+='<div class="system-message">本会话关联同一张工单，沟通不会自动改变工单状态</div>';out+=msg('林悦','林','厨房水管接口渗水，已把现场情况发在工单里。',role==='resident','居民');out+=msg('陈晓','陈','已安排周师傅上门处理，具体时间请在这里沟通。',role==='admin','社区管理员');out+=msg('周师傅','周','我已到达楼下，现在上门方便吗？',role==='staff','服务人员');out+=msg('林悦','林','方便的，我在家。',role==='resident','居民');if(d.closed)out+='<div class="system-message">工单已终审结束 · 历史消息只读留档</div>'}else if(d.type==='feedback'){out+='<div class="system-message">匿名反馈 · 对管理方隐藏居民身份</div>';out+=msg('匿名居民','匿','晚上十点后仍然有施工声音，希望可以协调一下。',role==='resident','匿名反馈');out+=msg('陈晓','陈','收到，我们会联系施工方核实，并跟进夜间作业情况。',role==='admin','社区管理员');out+=msg('匿名居民','匿','谢谢，希望尽快处理。',role==='resident','匿名反馈')}else if(d.type==='view'){out+=msg('林悦','林','周六下午两点方便看房吗？',role==='resident','居民');out+=msg('周师傅','周','可以，我会在社区门口等您。',role==='staff','带看人员');out+=msg('林悦','林','好的，到时见。',role==='resident','居民')}else{out+=msg('林悦','林','您好，请问已经提交的公共资源预约在哪里查看？',role==='resident','居民');out+=msg('陈晓','陈','可以从“我的预约”查看记录和预约详情。',role==='admin','社区管理员')}return out}
function businessOptions(d){if(d.type==='lease')return role==='admin'?[['file','发出 / 查看租赁协议'],['home','查看租约详情']]:[['view','预约本房源看房'],['file','查看 / 同意租赁协议'],['home','查看租约详情']];return [[categories.find(c=>c[0]===d.type)[2],d.type==='work'?'查看工单详情':d.type==='view'?'查看看房预约':d.type==='feedback'?'查看反馈详情':'查看社区信息']]}

function renderChat(){const d=getCurrent();if(state==='empty'||state==='error'){$('#chat-panel').innerHTML=`<div class="blank-panel"><div class="empty-icon">${icon(state==='error'?'feedback':'chat')}</div><h3>${state==='error'?'暂时无法加载会话':'从左侧开始一段沟通'}</h3><p>${state==='error'?'请检查网络后重试，已有消息不会被清除。':'有权访问的业务会话会集中显示在这里。'}</p>${state==='error'?'<button class="quiet-button" id="retry">重新加载</button>':''}</div>`;if($('#retry'))$('#retry').onclick=()=>{state='normal';renderList();renderChat();$('#state-select').value=state};return}if(!d)return;const closed=d.closed||state==='closed',feedback=d.type==='feedback',details=d.type==='lease'?'租约详情':d.type==='work'?'工单详情':d.type==='view'?'预约详情':feedback?'反馈详情':'社区信息';$('#chat-panel').innerHTML=`${state==='offline'?'<div class="connection-notice"><span>连接已中断，正在尝试恢复。发送前请确认连接。</span><button id="reconnect">重新连接</button></div>':''}<header class="chat-header"><button class="icon-button back-button" id="back-to-list" aria-label="返回会话列表">${icon('back')}</button><div style="flex:1;min-width:0"><h2><span class="title">${esc(d.title)}</span><span class="status ${closed?'closed':''}">${closed?'已关闭':d.status}</span></h2><p class="chat-subtitle">${esc(d.label)}<span class="sep">·</span>${feedback?'匿名居民与社区管理方':esc(d.subtitle)}</p></div><div class="header-actions"><button class="detail-button" id="detail">${details}</button><button class="icon-button" id="more" aria-label="会话菜单" aria-expanded="false">${icon('more')}</button></div></header><div class="message-history"><div class="messages-inner">${chatMessages(d)}</div></div>${closed?`<div class="readonly">${icon('lock')}此会话已关闭，历史消息可查看，不可继续发送</div>`:`<div class="chat-composer"><div class="composer-tools"><button class="tool-button" id="image-tool" aria-label="发送图片">${icon('image')}<span>图片</span></button><button class="tool-button" id="business-tool" aria-label="业务功能" aria-expanded="false">${icon('plus')}<span>业务功能</span></button></div><textarea id="composer-input" maxlength="500" placeholder="输入消息…" aria-label="消息输入框" ${state==='offline'?'disabled':''}>${esc(drafts[`${role}/${selected}`]||'')}</textarea><div class="composer-bottom"><small>Enter 发送 · Shift + Enter 换行</small><button class="send-button" id="send" ${state==='offline'?'disabled':''}>发送 ${icon('send')}</button></div></div>`}`;
$('#back-to-list').onclick=()=>$('.workspace').classList.add('show-list');$('#detail').onclick=()=>showDetail(details);$('#more').onclick=()=>{more=!more;renderOverlays()};if($('#reconnect'))$('#reconnect').onclick=()=>{state='normal';renderChat();$('#state-select').value='normal';toast('设计演示：连接已恢复')};if(!closed){$('#business-tool').onclick=()=>{menu=!menu;renderOverlays()};$('#image-tool').onclick=()=>toast('设计演示：此处打开本地图片选择及预览，不会上传文件');$('#composer-input').oninput=e=>drafts[`${role}/${selected}`]=e.target.value;$('#composer-input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendDemo()}};$('#send').onclick=sendDemo};if(state==='business')menu=true;renderOverlays();if(state==='history'){$('#chat-panel').insertAdjacentHTML('beforeend','<button class="new-marker" id="new-marker">3条新消息 ↓</button>');$('#new-marker').onclick=()=>{$('.message-history').scrollTop=$('.message-history').scrollHeight;$('#new-marker').remove()}}if(!['business','history'].includes(state))setTimeout(()=>{const h=$('.message-history');if(h)h.scrollTop=h.scrollHeight},0)}
function renderOverlays(){$$('.more-menu,.business-menu,.drawer').forEach(e=>e.remove());const d=getCurrent();if(!d)return;if(more){$('#chat-panel').insertAdjacentHTML('beforeend',`<div class="more-menu"><button id="members">${icon('direct')}查看${d.type==='feedback'?'沟通双方':'会话成员'}</button><button onclick="showDetail('关联业务')">${icon('file')}查看关联业务</button></div>`);$('#members').onclick=()=>{drawer='members';more=false;renderOverlays()}}$('#more')?.setAttribute('aria-expanded',String(more));if(menu&&!d.closed&&state!=='closed'){$('.chat-composer')?.insertAdjacentHTML('beforeend',`<div class="business-menu"><div class="menu-caption">${esc(d.label)} · 可用功能</div>${businessOptions(d).map(([i,l])=>`<button onclick="showDetail('${l}')">${icon(i)}${l}</button>`).join('')}</div>`)}$('#business-tool')?.setAttribute('aria-expanded',String(menu));if(drawer){const members=d.type==='feedback'?[['匿','匿名居民','居民身份已隐藏'],['陈','陈晓','社区管理员']]:['work','view'].includes(d.type)?[['林','林悦',d.type==='view'?'预约居民':'提交居民'],['陈','陈晓','社区管理员'],['周','周师傅',d.type==='view'?'带看人员':'服务人员']]:[['林','林悦','居民'],['陈','陈晓','社区管理员']];$('#chat-panel').insertAdjacentHTML('beforeend',`<aside class="drawer" role="dialog" aria-label="会话成员"><div class="drawer-title">${d.type==='feedback'?'沟通双方':'会话成员'}<button class="icon-button" id="close-drawer" aria-label="关闭成员面板">×</button></div><h4>${esc(d.title)}</h4>${members.map(([a,n,r])=>`<div class="member-row"><span class="avatar">${a}</span><div><strong>${n}</strong><small>${r}</small></div></div>`).join('')}<p class="drawer-note">${d.type==='feedback'?'匿名信息在列表、消息和成员面板保持一致。':'成员由关联业务和参与权限决定，不在这里任意拉人或退出群。'}</p></aside>`);$('#close-drawer').onclick=()=>{drawer=null;renderOverlays()}}}
function showDetail(name){toast(`设计演示：打开“${name}”，不会提交或改变业务状态`)}
function sendDemo(){const input=$('#composer-input'),value=input?.value.trim();if(!value||state==='offline')return;const d=getCurrent(),me=d.type==='feedback'&&role==='resident'?['匿名居民','匿','匿名反馈']:roleUsers[role];$('.messages-inner').insertAdjacentHTML('beforeend',msg(me[0],me[1],esc(value),true,me[2]));input.value='';drafts[`${role}/${selected}`]='';d.summary=`${me[0]}：${value}`;d.stamp=1500;d.time='刚刚';renderList();$('.message-history').scrollTop=$('.message-history').scrollHeight;toast('仅添加到设计稿演示，未发送到系统')}
$$('[data-role]').forEach(b=>b.onclick=()=>setRole(b.dataset.role));$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderList()});$('#search').oninput=()=>renderList();$('#create-conversation').onclick=()=>toast(role==='resident'?'设计演示：选择有权联系的社区管理方':'设计演示：选择所属社区及目标居民');$('#state-select').onchange=e=>{state=e.target.value;menu=more=false;drawer=null;if(state==='feedback'&&role==='staff'){toast('服务人员没有反馈会话权限，保持原有权限');state='normal';e.target.value=state}if(state==='feedback')selected='feedback:3';else if(state==='closed')selected='work:6';else if(!getCurrent())selected=role==='staff'?'work:2':'lease:1';renderRail();renderList();renderChat()};window.designState=()=>({role,state,category,selected,keys:data.map(d=>d.key)});setRole(role);
</script></body></html>
